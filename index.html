<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Alien Camera</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- カメラ入力。表示と撮影はcanvasで行います -->
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="view" aria-label="宇宙人と撮影するカメラ"></canvas>

  <!-- 自動起動できなかった場合の再試行ボタン -->
  <button
    id="startButton"
    class="icon-button start-button"
    type="button"
    aria-label="カメラを起動、または再試行"
    hidden
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h4l2-3h4l2 3h4v13H4z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>

  <button
    id="shootButton"
    type="button"
    aria-label="写真を撮る"
    disabled
  ></button>

  <div id="flash" aria-hidden="true"></div>

  <!-- 撮影した写真 -->
  <section id="preview" aria-label="撮影した写真" hidden>
    <img id="resultImage" alt="撮影した写真">

    <button
      id="closeButton"
      class="icon-button close-button"
      type="button"
      aria-label="カメラに戻る"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </button>

    <a
      id="saveButton"
      class="icon-button save-button"
      download="alien-photo.png"
      aria-label="写真を保存"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/>
      </svg>
    </a>
  </section>
</body>
</html>
